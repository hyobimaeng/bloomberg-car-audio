name: daily-digest

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      PODCAST_AUTHOR: ${{ vars.PODCAST_AUTHOR || github.repository_owner }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gpt-4o-mini' }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gpt-4o-mini-tts' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'alloy' }}
      LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '24' }}
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '8' }}
      BLOOMBERG_FEEDS: ${{ vars.BLOOMBERG_FEEDS || 'https://feeds.bloomberg.com/markets/news.rss,https://feeds.bloomberg.com/technology/news.rss,https://feeds.bloomberg.com/politics/news.rss' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SEND_AUDIO: ${{ vars.TELEGRAM_SEND_AUDIO || 'false' }}
      TELEGRAM_DISABLE_NOTIFICATION: ${{ vars.TELEGRAM_DISABLE_NOTIFICATION || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build digest
        run: node src/main.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: node src/notify.mjs dist/archive.json
